<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CitySync — Know your city in a heartbeat</title>
    <meta name="description" content="CitySync turns the noise of a living city into one clear, human pulse." />
    <meta name="generator" content="v0.app" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="white" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="black" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icon-light-32x32.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/icon-dark-32x32.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
  </head>
  <body class="antialiased">
    <!-- Sets the `dark` class before React (and any CSS) paints, so there is no flash of
         the wrong theme. Must stay in sync with THEME_KEY in src/app/ThemeProvider.jsx. -->
    <script>
      (function () {
        try {
          var k = 'cp.theme', s = localStorage.getItem(k), d = s === 'dark';
          document.documentElement.classList.toggle('dark', d);
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
